# EEG2Text 环境配置 - 支持 RTX 4090
# 使用方法: conda env create -f environment.yml
# 或手动安装: 见 install.sh

name: EEGToText-CUDA12
channels:
  - pytorch
  - nvidia
  - conda-forge
  - anaconda
  - defaults
dependencies:
  - python=3.9
  - pip
  - pytorch-cuda=12.1
  - pytorch::pytorch=2.1.0
  - torchvision
  - torchaudio
  - scipy
  - numpy
  - matplotlib
  - h5py
  - tqdm
  - pandas
  - scikit-learn
  - pip:
      - transformers==4.26.0
      - nltk
      - fuzzy-match==0.0.1
      - rouge==1.0.0
      - tensorboard
      - wandb
      - sentencepiece
      - protobuf<3.20
      - einops
