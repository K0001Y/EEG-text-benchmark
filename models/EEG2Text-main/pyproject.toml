[project]
name = "eeg2text"
version = "0.1.0"
description = "EEG2Text: EEG to text generation model"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.26.0",  # 原始要求 4.26.0，向上兼容
    "nltk>=3.8.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "h5py>=3.10.0",
    "tqdm>=4.65.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "fuzzy-match>=0.0.1",
    "rouge>=1.0.0",
    "tensorboard>=2.14.0",
    "wandb>=0.15.0",
    "sentencepiece>=0.1.99",
    "einops>=0.7.0",
    # protobuf<3.20 已移除：该约束与现代 protobuf 4.x 冲突，旧版 sentencepiece 要求，升级后不再需要
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
