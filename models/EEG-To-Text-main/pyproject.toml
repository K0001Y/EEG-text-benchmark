[project]
name = "eeg-to-text"
version = "0.1.0"
description = "EEG-To-Text: Decoding EEG signals to natural language"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "scipy>=1.11.0",
    "h5py>=3.10.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
    "transformers>=4.30.0",
    "nltk>=3.8.0",
    "fuzzy-match>=0.0.1",
    "rouge>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
