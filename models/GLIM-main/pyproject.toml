[project]
name = "glim"
version = "0.1.0"
description = "GLIM: Grounded Language-Interfaced Model for EEG"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.11.0",
    "rich>=13.7.0",
    "transformers>=4.40.0",
    "evaluate>=0.4.0",
    "peft>=0.12.0",
    "lightning>=2.4.0",
    "torchmetrics>=1.3.0",
    "einops>=0.8.0",
    "timm>=0.9.16",
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
