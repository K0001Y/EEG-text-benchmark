[project]
name = "cet-mae"
version = "0.1.0"
description = "CET-MAE: Cross-modal EEG-Text Masked Autoencoder"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "nltk>=3.8.0",
    "tqdm>=4.65.0",
    "rouge-score>=0.1.0",
    "evaluate>=0.4.0",
    "wandb>=0.15.0",
    "fuzzy-match>=0.0.1",
    "rouge>=1.0.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "sentencepiece>=0.1.99",
    "einops>=0.7.0",
    "absl-py>=2.0.0",
    "h5py>=3.10.0",
    "jiwer>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
