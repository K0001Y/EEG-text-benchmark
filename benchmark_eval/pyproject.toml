[project]
name = "benchmark-eval"
version = "0.1.0"
description = "Unified EEG-to-Text Benchmark Evaluation Framework"
requires-python = ">=3.9"
dependencies = [
    # 核心依赖
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "h5py>=3.10.0",
    "tqdm>=4.65.0",
    
    # 深度学习框架
    "transformers>=4.30.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
    
    # 评估指标
    "nltk>=3.8.0",
    "rouge>=1.0.0",
    "rouge-score>=0.1.0",
    "evaluate>=0.4.0",
    "jiwer>=3.0.0",
    
    # 工具库
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "einops>=0.7.0",
    "sentencepiece>=0.1.99",
    "tensorboard>=2.14.0",
    "pyyaml>=6.0",
    
    # 可选依赖
    "rich>=13.7.0",
    "timm>=0.9.16",
    "peft>=0.12.0",
    "lightning>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "ipykernel>=6.25.0",
    "jupyter>=1.0.0",
]

# 各个模型的额外依赖
[project.optional-dependencies]
cet-mae = [
    "absl-py>=2.0.0",
    "wandb>=0.15.0",
]

eeg-to-text = [
    "fuzzy-match>=0.0.1",
]

eeg2text = [
    "fuzzy-match>=0.0.1",
    "tensorboard>=2.14.0",
    "wandb>=0.15.0",
    "protobuf<3.20",
]

glim = [
    "torchmetrics>=1.3.0",
    "peft>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
